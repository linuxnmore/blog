<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
</head>
<body>
  <main>
    <article>
      <h1>{{ page.title }}</h1>
      {% if page.date %}
        <p>{{ page.date }}</p>
      {% endif %}
      {{ page.content | safe }}
    </article>
  </main>
</body>
</html>
